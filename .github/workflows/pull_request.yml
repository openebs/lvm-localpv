name: Pull Request CI

on:
  pull_request:
    branches:
      - develop
      - "release/**"
  workflow_dispatch:

jobs:
  relevant-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - '**'
              - '!*.md'
              - '!BUILDMETA'
              - '!changelogs/**'
              - '!docs/**'
              - '!design/**'
              - '!LICENSE'
              - '!MAINTAINERS'
  lint:
    needs: ["relevant-changes"]
    if: needs.relevant-changes.outputs.relevant == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      branch-name: ${{ github.event.pull_request.base.ref }}
      action-name: ${{ github.event_name }}
      validate-codegen: true

  tests:
    needs: ["lint", "relevant-changes"]
    if: needs.relevant-changes.outputs.relevant == 'true'
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  csi-driver:
    runs-on: ubuntu-latest
    needs: ["lint", "relevant-changes"]
    if: needs.relevant-changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./buildscripts/lvm-driver/Dockerfile.buildx
          push: false
          platforms: linux/amd64, linux/arm64
 
  ci:
    if: ${{ success() || needs.relevant-changes.outputs.relevant == 'false' }}
    needs:
      - lint
      - tests
      - csi-driver
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
