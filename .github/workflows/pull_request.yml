name: Pull Request CI

on:
  pull_request:
    branches:
      - develop
      - "release/**"
  workflow_dispatch:
  workflow_call:

jobs:
  preconditions:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.relevant == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - '**'
              - '!*.md'
              - '!BUILDMETA'
              - '!changelogs/**'
              - '!docs/**'
              - '!design/**'
              - '!LICENSE'
              - '!MAINTAINERS'
  lint:
    needs: ["preconditions"]
    if: needs.preconditions.outputs.run == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      branch-name: ${{ github.event.pull_request.base.ref || ((github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) && github.ref_name) || '' }}
      action-name: ${{ github.event_name }}
      validate-codegen: true

  tests:
    needs: ["lint", "preconditions"]
    if: needs.preconditions.outputs.run == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  csi-driver:
    runs-on: cncf-ubuntu-16-64-x86
    needs: ["lint", "preconditions"]
    if: needs.preconditions.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./buildscripts/lvm-driver/Dockerfile.buildx
          push: false
          sbom: true
          provenance: mode=max
          platforms: linux/amd64, linux/arm64
 
  ci:
    if: ${{ success() || needs.preconditions.outputs.run == 'false' }}
    needs:
      - preconditions
      - lint
      - tests
      - csi-driver
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
