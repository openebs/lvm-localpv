name: Tests

on:
  workflow_call:
    inputs:
      coverage:
        description: Upload code coverage
        required: false
        default: true
        type: boolean

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Unit test
        run: make test

      # todo: this coverage was previously not reported, and since the value is rather low
      # it's failing the checks
      # Also the bdd coverage is incorrect, it's not collecting the data from the pods...
      - uses: codecov/codecov-action@v7
        if: inputs.coverage
        with:
          use_oidc: true
          directory: ./coverage
          flags: unittests
          fail_ci_if_error: true
          dry_run: true

  bdd-tests:
    runs-on: cncf-ubuntu-8-32-x86
    permissions:
      contents: read
      id-token: write
    needs: ["unit-tests"]
    strategy:
      fail-fast: true
      matrix:
        kubernetes: [v1.34.3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Build images locally
        run: make lvm-driver-image fio-image

      - uses: ./.github/actions/setup-minikube
        with:
          kubernetes-version: ${{ matrix.kubernetes }}

      - run: make bootstrap

      - env:
          OPENEBS_NAMESPACE: "openebs"
        run: make ci

      - uses: codecov/codecov-action@v7
        if: inputs.coverage
        with:
          use_oidc: true
          disable_search: true
          files: ./tests/bdd_coverage.txt
          flags: bddtests
          fail_ci_if_error: true

  results:
    runs-on: ubuntu-latest
    needs: [bdd-tests]
    if: ${{ !cancelled() }}
    steps:
      - if: ${{ needs.bdd-tests.result != 'success' }}
        run: exit 1
      - run: exit 0
